[package]
name = "fungeo"
version = "0.1.2"
edition = "2024"
# Oldest toolchain that builds this; the `msrv` CI job keeps it true.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/anwarahmed/fungeo"
description = "A geography quiz for children, in the terminal: build a bridge, one right answer at a time"
readme = "README.md"

[dependencies]
ratatui = "0.30.2"
sha2 = "0.11.0"
ureq = "3.4.2"

[profile.release]
lto = true
# Keep symbol names so a panic in the field has a readable backtrace.
strip = "debuginfo"
